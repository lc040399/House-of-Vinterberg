<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>House of Vinterberg – Header</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --lavender:   #ede8f2;
      --lavender-b: #d8cfe6;
      --plum:       #7c4fa0;
      --plum-light: #9b6fc4;
      --ink:        #1a1a2e;
      --white:      #ffffff;
      --cta-bg:     #1a1a2e;
      --cta-hover:  #2e2e50;
      --radius-pill: 999px;
      --font-body:  'Georgia', 'Times New Roman', serif;
      --font-ui:    system-ui, -apple-system, sans-serif;
      --header-h:   72px;
      --top-bar-h:  6px;
    }

    body {
      background: #f5f0fa;
      font-family: var(--font-ui);
      min-height: 120vh; /* show content behind */
    }

    /* ── Accent stripe at very top ─────────────────────────────────────── */
    .top-stripe {
      height: var(--top-bar-h);
      background: linear-gradient(90deg, var(--plum) 0%, var(--plum-light) 100%);
    }

    /* ── Main header ───────────────────────────────────────────────────── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--lavender);
      border-bottom: 1.5px solid var(--lavender-b);
      box-shadow: 0 2px 12px rgba(124, 79, 160, 0.10);
      height: var(--header-h);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 28px;
      gap: 16px;
    }

    /* ── Left zone ─────────────────────────────────────────────────────── */
    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    /* Hamburger */
    .hamburger {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      padding: 8px;
      border: none;
      background: transparent;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .hamburger:hover { background: rgba(124,79,160,0.12); }
    .hamburger span {
      display: block;
      width: 22px;
      height: 2px;
      background: var(--ink);
      border-radius: 2px;
      transition: transform 0.25s, opacity 0.25s;
    }
    /* open state */
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    /* Nav links (desktop) */
    .nav-links {
      display: flex;
      gap: 4px;
      list-style: none;
    }
    .nav-links a {
      text-decoration: none;
      color: var(--ink);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.03em;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      transition: background 0.2s, color 0.2s;
    }
    .nav-links a:hover {
      background: rgba(124,79,160,0.14);
      color: var(--plum);
    }

    /* ── Center: logo ──────────────────────────────────────────────────── */
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      text-decoration: none;
      user-select: none;
    }

    /* Decorative arch above logo */
    .logo-arch {
      width: 54px;
      height: 22px;
      position: relative;
      margin-bottom: -2px;
    }
    .logo-arch::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--plum);
      clip-path: polygon(10% 100%, 50% 0%, 90% 100%);
      border-radius: 2px 2px 0 0;
    }

    .logo-eyebrow {
      font-family: var(--font-ui);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--plum);
      line-height: 1;
    }

    .logo-wordmark {
      font-family: var(--font-body);
      font-size: 26px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink);
      line-height: 1.15;
    }

    /* ── Right zone ────────────────────────────────────────────────────── */
    .header-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
    }

    /* Language switcher */
    .lang-switcher {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .lang-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--ink);
      transition: background 0.2s, color 0.2s;
    }
    .lang-btn:hover,
    .lang-btn.active {
      background: rgba(124,79,160,0.14);
      color: var(--plum);
    }
    .lang-btn .flag {
      font-size: 18px;
      line-height: 1;
    }

    /* CTA button */
    .btn-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--cta-bg);
      color: var(--white);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 10px 22px;
      border-radius: var(--radius-pill);
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 2px 8px rgba(26,26,46,0.20);
      white-space: nowrap;
    }
    .btn-cta:hover {
      background: var(--cta-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(26,26,46,0.28);
    }
    .btn-cta:active { transform: translateY(0); }

    /* ── Mobile nav drawer ─────────────────────────────────────────────── */
    .nav-drawer {
      position: fixed;
      top: calc(var(--top-bar-h) + var(--header-h));
      left: 0;
      width: 280px;
      height: calc(100vh - var(--top-bar-h) - var(--header-h));
      background: var(--white);
      box-shadow: 4px 0 24px rgba(124,79,160,0.15);
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 99;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .nav-drawer.open { transform: translateX(0); }
    .nav-drawer a {
      text-decoration: none;
      color: var(--ink);
      font-size: 15px;
      font-weight: 500;
      padding: 12px 16px;
      border-radius: 10px;
      transition: background 0.2s, color 0.2s;
    }
    .nav-drawer a:hover {
      background: var(--lavender);
      color: var(--plum);
    }

    /* Overlay */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(26,26,46,0.25);
      backdrop-filter: blur(2px);
      z-index: 98;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .overlay.visible { display: block; }
    .overlay.open { opacity: 1; }

    /* ── Responsive ────────────────────────────────────────────────────── */
    @media (max-width: 720px) {
      .nav-links { display: none; }
      .lang-btn span:not(.flag) { display: none; }
      header { padding: 0 16px; }
      .logo-wordmark { font-size: 21px; }
      .btn-cta { font-size: 12px; padding: 9px 16px; }
    }

    /* ── Demo content below header ─────────────────────────────────────── */
    .demo-body {
      max-width: 860px;
      margin: 60px auto;
      padding: 0 24px;
      font-family: var(--font-body);
      color: var(--ink);
      text-align: center;
    }
    .demo-body h1 { font-size: 2rem; margin-bottom: 12px; }
    .demo-body p { color: #555; font-size: 1rem; line-height: 1.7; }
  </style>
</head>
<body>

  <div class="top-stripe"></div>

  <header>
    <!-- Left -->
    <div class="header-left">
      <button class="hamburger" id="menuBtn" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav>
        <ul class="nav-links">
          <li><a href="#">Om os</a></li>
          <li><a href="#">Behandlinger</a></li>
          <li><a href="#">Priser</a></li>
          <li><a href="#">Kontakt</a></li>
        </ul>
      </nav>
    </div>

    <!-- Center logo -->
    <a class="logo-wrap" href="#" aria-label="House of Vinterberg – Forside">
      <div class="logo-arch" aria-hidden="true"></div>
      <span class="logo-eyebrow">House of</span>
      <span class="logo-wordmark">Vinterberg</span>
    </a>

    <!-- Right -->
    <div class="header-right">
      <div class="lang-switcher" role="group" aria-label="Vælg sprog">
        <button class="lang-btn active" aria-label="Dansk">
          <span class="flag">🇩🇰</span><span>DA</span>
        </button>
        <button class="lang-btn" aria-label="English">
          <span class="flag">🇬🇧</span><span>EN</span>
        </button>
      </div>
      <a href="#book" class="btn-cta">Book en uforpligtende tid</a>
    </div>
  </header>

  <!-- Mobile drawer -->
  <nav class="nav-drawer" id="navDrawer" aria-label="Mobilmenu">
    <a href="#">Om os</a>
    <a href="#">Behandlinger</a>
    <a href="#">Priser</a>
    <a href="#">Kontakt</a>
  </nav>
  <div class="overlay" id="overlay"></div>

  <!-- Demo content -->
  <div class="demo-body">
    <h1>Velkommen til House of Vinterberg</h1>
    <p>Oplev eksklusive skønhedsbehandlinger i rolige og elegante omgivelser.<br>
       Book din uforpligtende konsultation i dag.</p>
  </div>

  <script>
    const menuBtn   = document.getElementById('menuBtn');
    const navDrawer = document.getElementById('navDrawer');
    const overlay   = document.getElementById('overlay');

    function openMenu() {
      menuBtn.classList.add('open');
      navDrawer.classList.add('open');
      overlay.classList.add('visible');
      requestAnimationFrame(() => overlay.classList.add('open'));
      menuBtn.setAttribute('aria-expanded', 'true');
    }

    function closeMenu() {
      menuBtn.classList.remove('open');
      navDrawer.classList.remove('open');
      overlay.classList.remove('open');
      overlay.addEventListener('transitionend', () => overlay.classList.remove('visible'), { once: true });
      menuBtn.setAttribute('aria-expanded', 'false');
    }

    menuBtn.addEventListener('click', () =>
      navDrawer.classList.contains('open') ? closeMenu() : openMenu()
    );
    overlay.addEventListener('click', closeMenu);

    // Language toggle
    document.querySelectorAll('.lang-btn').forEach(btn =>
      btn.addEventListener('click', () => {
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      })
    );
  </script>

</body>
</html>
