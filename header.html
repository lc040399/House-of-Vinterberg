<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>House of Vinterberg – Header</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white: #ffffff;
      --black: #111111;
      --gray:  #e5e5e5;
      --header-h: 72px;
    }

    body {
      background: #f9f9f9;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 120vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--white);
      border-bottom: 1px solid var(--gray);
      height: var(--header-h);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 28px;
    }

    /* ── Left ── */
    .header-left {
      display: flex;
      align-items: center;
    }

    .hamburger {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      padding: 8px;
      border: none;
      background: transparent;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .hamburger:hover { background: #f0f0f0; }
    .hamburger span {
      display: block;
      width: 22px;
      height: 1.5px;
      background: var(--black);
      border-radius: 2px;
      transition: transform 0.25s, opacity 0.25s;
    }
    .hamburger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

    /* ── Center logo ── */
    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }
    .logo-wrap img {
      height: 44px;
      width: auto;
      display: block;
    }

    /* ── Right ── */
    .header-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }

    .lang-switcher {
      display: flex;
      gap: 2px;
      align-items: center;
    }
    .lang-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #555;
      transition: background 0.15s, color 0.15s;
    }
    .lang-btn:hover { background: #f0f0f0; color: var(--black); }
    .lang-btn.active { color: var(--black); }
    .lang-btn .flag { font-size: 16px; line-height: 1; }

    .btn-cta {
      display: inline-flex;
      align-items: center;
      background: var(--black);
      color: var(--white);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 10px 22px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.15s;
      white-space: nowrap;
    }
    .btn-cta:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn-cta:active { transform: translateY(0); }

    /* ── Drawer ── */
    .nav-drawer {
      position: fixed;
      top: var(--header-h);
      left: 0;
      width: 280px;
      height: calc(100vh - var(--header-h));
      background: var(--white);
      border-right: 1px solid var(--gray);
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 99;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .nav-drawer.open { transform: translateX(0); }
    .nav-drawer a {
      text-decoration: none;
      color: var(--black);
      font-size: 15px;
      font-weight: 500;
      padding: 12px 16px;
      border-radius: 8px;
      transition: background 0.15s;
    }
    .nav-drawer a:hover { background: #f5f5f5; }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.20);
      z-index: 98;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .overlay.visible { display: block; }
    .overlay.open { opacity: 1; }

    @media (max-width: 600px) {
      header { padding: 0 16px; }
      .logo-wrap img { height: 36px; }
      .btn-cta { font-size: 12px; padding: 9px 14px; }
      .lang-btn span:not(.flag) { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <button class="hamburger" id="menuBtn" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>

    <a class="logo-wrap" href="#" aria-label="House of Vinterberg – Forside">
      <img src="https://houseofvinterberg.com/wp-content/uploads/2025/12/HOVBLACK1-4.png" alt="House of Vinterberg" />
    </a>

    <div class="header-right">
      <div class="lang-switcher" role="group" aria-label="Vælg sprog">
        <button class="lang-btn active" aria-label="Dansk">
          <span class="flag">🇩🇰</span><span>DA</span>
        </button>
        <button class="lang-btn" aria-label="English">
          <span class="flag">🇬🇧</span><span>EN</span>
        </button>
      </div>
      <a href="#book" class="btn-cta">Book en uforpligtende tid</a>
    </div>
  </header>

  <nav class="nav-drawer" id="navDrawer" aria-label="Menu">
    <a href="#">Om os</a>
    <a href="#">Behandlinger</a>
    <a href="#">Priser</a>
    <a href="#">Kontakt</a>
  </nav>
  <div class="overlay" id="overlay"></div>

  <script>
    const menuBtn   = document.getElementById('menuBtn');
    const navDrawer = document.getElementById('navDrawer');
    const overlay   = document.getElementById('overlay');

    function openMenu() {
      menuBtn.classList.add('open');
      navDrawer.classList.add('open');
      overlay.classList.add('visible');
      requestAnimationFrame(() => overlay.classList.add('open'));
      menuBtn.setAttribute('aria-expanded', 'true');
    }
    function closeMenu() {
      menuBtn.classList.remove('open');
      navDrawer.classList.remove('open');
      overlay.classList.remove('open');
      overlay.addEventListener('transitionend', () => overlay.classList.remove('visible'), { once: true });
      menuBtn.setAttribute('aria-expanded', 'false');
    }

    menuBtn.addEventListener('click', () =>
      navDrawer.classList.contains('open') ? closeMenu() : openMenu()
    );
    overlay.addEventListener('click', closeMenu);

    document.querySelectorAll('.lang-btn').forEach(btn =>
      btn.addEventListener('click', () => {
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      })
    );
  </script>

</body>
</html>
